name: Conformance profile
on:
  push:
    branches: [main]
  pull_request:
jobs:
  phase1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:conformance
      - run: npm run test:conformance:consumer
